[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kart-scraper"
version = "0.1.0"
description = "Search the internet for go-karts for sale near you and rate each listing with a custom weighted score."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "geopy>=2.4",
    "rich>=13.7",
    "jinja2>=3.1",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kart-scraper = "kart_scraper.cli:main"
signal-desk = "signal_desk.cli:main"

[tool.setuptools.packages.find]
include = ["kart_scraper*", "signal_desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
